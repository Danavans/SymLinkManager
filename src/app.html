<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Symlink Manager</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141312;
        color: #f5f3f0;
        font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 155, 115, 0.15), transparent 55%),
          radial-gradient(circle at 80% 5%, rgba(242, 100, 48, 0.18), transparent 45%),
          linear-gradient(160deg, rgba(20, 19, 18, 0.9) 0%, rgba(10, 10, 10, 0.98) 100%);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="boot" id="boot">Loading...</div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const boot = document.getElementById("boot");
        if (boot) boot.style.display = "none";
      });
    </script>
  </body>
</html>
