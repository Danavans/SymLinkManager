name: Build SymLinkManager

on:
  workflow_dispatch:
    inputs:
      windows_portable:
        description: Windows portable EXE
        type: boolean
        default: true
      linux_portable:
        description: Linux portable binary
        type: boolean
        default: true
      linux_appimage:
        description: Linux AppImage
        type: boolean
        default: true
      linux_deb:
        description: Linux DEB
        type: boolean
        default: true
      macos_dmg:
        description: macOS DMG
        type: boolean
        default: false
  workflow_call:
    inputs:
      windows_portable:
        type: boolean
        default: true
      linux_portable:
        type: boolean
        default: true
      linux_appimage:
        type: boolean
        default: true
      linux_deb:
        type: boolean
        default: true
      macos_dmg:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    if: inputs.windows_portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: SymLinkManager-Windows-Portable
          path: src-tauri/target/release/symlinkmanager.exe
          if-no-files-found: error

  linux:
    if: inputs.linux_portable || inputs.linux_appimage || inputs.linux_deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Bundle selected formats
        if: inputs.linux_appimage || inputs.linux_deb
        env:
          APPIMAGE: ${{ inputs.linux_appimage }}
          DEB: ${{ inputs.linux_deb }}
        run: |
          bundles=()
          if [[ "$APPIMAGE" == true ]]; then bundles+=(appimage); fi
          if [[ "$DEB" == true ]]; then bundles+=(deb); fi
          IFS=,
          npm run tauri bundle -- --bundles "${bundles[*]}"
      - if: inputs.linux_portable
        uses: actions/upload-artifact@v4
        with:
          name: SymLinkManager-Linux-Portable
          path: src-tauri/target/release/symlinkmanager
          if-no-files-found: error
      - if: inputs.linux_appimage
        uses: actions/upload-artifact@v4
        with:
          name: SymLinkManager-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - if: inputs.linux_deb
        uses: actions/upload-artifact@v4
        with:
          name: SymLinkManager-Linux-DEB
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  macos:
    if: inputs.macos_dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - run: npm run tauri bundle -- --bundles dmg --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: SymLinkManager-macOS-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
